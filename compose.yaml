services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:80"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    command: /app/.venv/bin/fastapi dev src/doniczka_ai_server/main.py --port 80 --host 0.0.0.0
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      eclipse-mosquitto:
        condition: service_healthy
  mqtt-subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/.venv/bin/python -u mqtt_subscriber.py
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - MQTT_BROKER_HOST
      - MQTT_BROKER_PORT
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      eclipse-mosquitto:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb-ha:pg18
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  eclipse-mosquitto:
    image: eclipse-mosquitto
    ports:
      - "${MQTT_BROKER_PORT}:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-p",
          "1883",
          "-t",
          "healthcheck",
          "-m",
          "ping",
          "-q",
          "1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mosquitto-data:
  mosquitto-log:
  db-data:
