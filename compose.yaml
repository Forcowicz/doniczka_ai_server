services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:80"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    command: /app/.venv/bin/fastapi dev src/doniczka_ai_server/main.py --port 80 --host 0.0.0.0
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      eclipse-mosquito:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine3.24
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  eclipse-mosquito:
    image: eclipse-mosquitto
    ports:
      - "${EM_PORT}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-p", "1883", "-t", "healthcheck", "-m", "ping", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mosquitto-data:
  mosquitto-log:
  db-data:
