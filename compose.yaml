services:
  api:
    container_name: doniczka-api
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/.venv/bin/fastapi dev src/doniczka_ai_server/main.py --port 80 --host 0.0.0.0
    volumes:
      - ./src:/app/src
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - MQTT_BROKER_HOST
      - MQTT_BROKER_PORT
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_BUCKET_NAME
      - AWS_REGION
    depends_on:
      postgres-doniczka:
        condition: service_healthy
      eclipse-mosquitto:
        condition: service_healthy
    networks:
      - default

  mqtt-subscriber:
    container_name: doniczka-mqtt-subscriber
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/.venv/bin/python -u mqtt_subscriber.py
    volumes:
      - ./src:/app/src
      - ./mqtt_subscriber.py:/app/mqtt_subscriber.py
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - MQTT_BROKER_HOST
      - MQTT_BROKER_PORT
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_BUCKET_NAME
      - AWS_REGION
    depends_on:
      postgres-doniczka:
        condition: service_healthy
      eclipse-mosquitto:
        condition: service_healthy
    networks:
      - default

  postgres-doniczka:
    image: timescale/timescaledb-ha:pg18
    ports:
      - "127.0.0.1:6021:5432"
    volumes:
      - db-data-pg18:/home/postgres/pgdata/data
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  eclipse-mosquitto:
    image: eclipse-mosquitto
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-p",
          "1883",
          "-t",
          "healthcheck",
          "-m",
          "ping",
          "-q",
          "1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mosquitto-data:
  mosquitto-log:
  db-data-pg18:
