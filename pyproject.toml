[project]
name = "doniczka-ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marek Żywar", email = "forcowicz@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
doniczka-ai-server = "doniczka_ai_server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
