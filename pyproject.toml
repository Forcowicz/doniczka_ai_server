[project]
name = "doniczka-ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marek Żywar", email = "forcowicz@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncio>=4.0.0",
    "boto3>=1.43.123",
    "fastapi[standard]>=0.162.0",
    "google-genai>=3.0.0",
    "paho-mqtt>=2.1.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
doniczka-ai-server = "doniczka_ai_server:main"
seed-telemetry = "doniczka_ai_server.database.seed:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
